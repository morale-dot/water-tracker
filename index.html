<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水分摂取記録</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #cffafe 100%);
            min-height: 100vh;
            padding: 8px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
        }

        .icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 24px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .total-display {
            text-align: center;
            margin: 32px 0;
        }

        .total-amount {
            font-size: 56px;
            font-weight: bold;
            color: #3b82f6;
        }

        .total-unit {
            font-size: 32px;
            margin-left: 8px;
        }

        .total-label {
            color: #6b7280;
            margin-top: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .calendar-view {
            display: none;
        }

        .calendar-view.active {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .calendar-nav button {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
            padding: 8px;
        }

        .calendar-title {
            font-size: 20px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            width: 100%;
        }

        .calendar-day-header {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
            padding: 8px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 4px;
            font-size: 12px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .calendar-day.today {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .calendar-day-number {
            color: #6b7280;
            font-weight: 500;
            font-size: 12px;
        }

        .calendar-day-amount {
            margin-top: 2px;
            font-size: 10px;
            font-weight: bold;
            color: #3b82f6;
        }

        .calendar-day-amount.alcohol {
            color: #ef4444;
        }

        .calendar-day.editable {
            cursor: pointer;
        }

        .calendar-day.editable:hover {
            background: #f3f4f6;
        }

        .alcohol-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0;
            padding: 12px;
            background: #fef2f2;
            border-radius: 12px;
            border: 1px solid #fecaca;
        }

        .alcohol-check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .alcohol-check label {
            font-size: 14px;
            color: #991b1b;
            cursor: pointer;
            user-select: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #1f2937;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .back-btn {
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .export-btn {
            width: 100%;
            margin-top: 16px;
            background: #10b981;
            color: white;
        }

        .export-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 入力画面 -->
        <div id="inputView">
            <div class="card">
                <div class="icon">💧</div>
                <h1>水分摂取記録</h1>
                
                <div class="total-display">
                    <div>
                        <span class="total-amount" id="todayTotal">0.0</span>
                        <span class="total-unit">L</span>
                    </div>
                    <div class="total-label">今日の合計</div>
                </div>

                <div class="input-group">
                    <input type="number" id="amountInput" placeholder="ml" min="0">
                    <button class="btn btn-primary" onclick="addWater()">追加</button>
                </div>

                <div class="preset-buttons">
                    <button class="btn btn-secondary" onclick="addPreset(100)">100ml</button>
                    <button class="btn btn-secondary" onclick="addPreset(200)">200ml</button>
                    <button class="btn btn-secondary" onclick="addPreset(500)">500ml</button>
                </div>

                <div class="alcohol-check">
                    <input type="checkbox" id="alcoholCheck" onchange="toggleAlcohol()">
                    <label for="alcoholCheck">🍺 今日はお酒を飲んだ</label>
                </div>

                <button class="btn btn-secondary" style="width: 100%;" onclick="showCalendar()">📅 カレンダー表示</button>

                <button class="btn btn-secondary export-btn" onclick="exportCSV()">💾 CSVダウンロード</button>
            </div>
        </div>

        <!-- カレンダー画面 -->
        <div id="calendarView" class="calendar-view">
            <div class="card">
                <button class="btn btn-secondary back-btn" onclick="showInput()">💧 記録に戻る</button>
                
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button onclick="changeMonth(-1)">←</button>
                        <div class="calendar-title" id="calendarTitle"></div>
                        <button onclick="changeMonth(1)">→</button>
                    </div>
                </div>

                <div class="calendar-grid">
                    <div class="calendar-day-header">日</div>
                    <div class="calendar-day-header">月</div>
                    <div class="calendar-day-header">火</div>
                    <div class="calendar-day-header">水</div>
                    <div class="calendar-day-header">木</div>
                    <div class="calendar-day-header">金</div>
                    <div class="calendar-day-header">土</div>
                </div>
                <div class="calendar-grid" id="calendarDays">
                </div>

                <button class="btn btn-secondary export-btn" onclick="exportCSV()">💾 CSVダウンロード</button>
            </div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalDate"></div>
            <div class="input-group" style="flex-direction: column; gap: 12px;">
                <input type="number" id="editAmount" placeholder="水分摂取量 (ml)" style="width: 100%;">
                <div class="alcohol-check" style="margin: 0;">
                    <input type="checkbox" id="editAlcoholCheck">
                    <label for="editAlcoholCheck">🍺 お酒を飲んだ</label>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeEditModal()">キャンセル</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentMonth = new Date();
        let editingDate = null;

        // ページ読み込み時に今日のデータを表示
        window.onload = function() {
            loadTodayData();
            
            // Enterキーで追加
            document.getElementById('amountInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addWater();
                }
            });

            // 10秒ごとに日付変更をチェック
            setInterval(checkDateChange, 10000);
        };

        let lastLoadedDate = new Date().toISOString().split('T')[0];

        function checkDateChange() {
            const currentDate = getToday();
            if (currentDate !== lastLoadedDate) {
                lastLoadedDate = currentDate;
                loadTodayData();
            }
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function getTodayKey() {
            return 'water:' + getToday();
        }

        function getAlcoholKey(date) {
            return 'alcohol:' + date;
        }

        function loadTodayData() {
            const today = getToday();
            const data = localStorage.getItem(getTodayKey());
            const total = data ? parseInt(data) : 0;
            document.getElementById('todayTotal').textContent = (total / 1000).toFixed(1);

            // Load alcohol flag
            const alcoholFlag = localStorage.getItem(getAlcoholKey(today));
            document.getElementById('alcoholCheck').checked = alcoholFlag === 'true';
        }

        function toggleAlcohol() {
            const today = getToday();
            const checked = document.getElementById('alcoholCheck').checked;
            localStorage.setItem(getAlcoholKey(today), checked);
        }

        function addWater() {
            const input = document.getElementById('amountInput');
            const amount = parseInt(input.value);
            
            if (!amount || amount <= 0) return;

            const currentTotal = parseInt(localStorage.getItem(getTodayKey()) || '0');
            const newTotal = currentTotal + amount;
            
            localStorage.setItem(getTodayKey(), newTotal);
            document.getElementById('todayTotal').textContent = (newTotal / 1000).toFixed(1);
            input.value = '';
        }

        function addPreset(amount) {
            const currentTotal = parseInt(localStorage.getItem(getTodayKey()) || '0');
            const newTotal = currentTotal + amount;
            
            localStorage.setItem(getTodayKey(), newTotal);
            document.getElementById('todayTotal').textContent = (newTotal / 1000).toFixed(1);
        }

        function showCalendar() {
            document.getElementById('inputView').style.display = 'none';
            document.getElementById('calendarView').classList.add('active');
            renderCalendar();
        }

        function showInput() {
            document.getElementById('calendarView').classList.remove('active');
            document.getElementById('inputView').style.display = 'block';
            loadTodayData();
        }

        function changeMonth(delta) {
            currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            
            document.getElementById('calendarTitle').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();

            let html = '';
            
            // 空白セル - 明示的にcalendar-dayクラスを付ける
            for (let i = 0; i < startingDayOfWeek; i++) {
                html += '<div class="calendar-day" style="visibility: hidden;"></div>';
            }

            // 日付セル
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const amount = parseInt(localStorage.getItem('water:' + dateStr) || '0');
                const hasAlcohol = localStorage.getItem('alcohol:' + dateStr) === 'true';
                const isToday = dateStr === getToday();
                
                html += `<div class="calendar-day editable ${isToday ? 'today' : ''}" onclick="openEditModal('${dateStr}')">
                    <div class="calendar-day-number">${day}</div>
                    ${amount > 0 ? `<div class="calendar-day-amount ${hasAlcohol ? 'alcohol' : ''}">${(amount / 1000).toFixed(1)}L</div>` : ''}
                </div>`;
            }

            document.getElementById('calendarDays').innerHTML = html;
        }

        function openEditModal(date) {
            editingDate = date;
            const amount = parseInt(localStorage.getItem('water:' + date) || '0');
            const hasAlcohol = localStorage.getItem('alcohol:' + date) === 'true';
            
            document.getElementById('modalDate').textContent = date + 'のデータ編集';
            document.getElementById('editAmount').value = amount || '';
            document.getElementById('editAlcoholCheck').checked = hasAlcohol;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingDate = null;
        }

        function saveEdit() {
            if (!editingDate) return;

            const amount = parseInt(document.getElementById('editAmount').value) || 0;
            const hasAlcohol = document.getElementById('editAlcoholCheck').checked;

            if (amount > 0) {
                localStorage.setItem('water:' + editingDate, amount);
            } else {
                localStorage.removeItem('water:' + editingDate);
            }

            localStorage.setItem('alcohol:' + editingDate, hasAlcohol);

            closeEditModal();
            renderCalendar();
            
            // 今日のデータを編集した場合は表示を更新
            if (editingDate === getToday()) {
                loadTodayData();
            }
        }

        function exportCSV() {
            // Get all water data from localStorage
            const data = [];
            const dates = new Set();

            // Collect all dates from water and alcohol data
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('water:')) {
                    dates.add(key.replace('water:', ''));
                } else if (key.startsWith('alcohol:')) {
                    dates.add(key.replace('alcohol:', ''));
                }
            }

            // Build data array
            dates.forEach(date => {
                const ml = localStorage.getItem('water:' + date) || '0';
                const hasAlcohol = localStorage.getItem('alcohol:' + date) === 'true';
                data.push({ date, ml, hasAlcohol });
            });

            // Sort by date
            data.sort((a, b) => a.date.localeCompare(b.date));

            // Create CSV content
            let csv = '日付,摂取量(ml),摂取量(L),飲酒\n';
            data.forEach(item => {
                const liters = (parseInt(item.ml) / 1000).toFixed(1);
                const alcoholFlag = item.hasAlcohol ? 'あり' : 'なし';
                csv += `${item.date},${item.ml},${liters},${alcoholFlag}\n`;
            });

            // Download CSV
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            const filename = `水分摂取記録_${new Date().toISOString().split('T')[0]}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
